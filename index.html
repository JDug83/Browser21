<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#faf9f5;color:#141413}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#eef2f8">
<title>GlassTab</title>
<style>
:root{
 --fg:#0b0b0f;--sub:rgba(60,60,67,.72);--blue:#0a7aff;--line:rgba(60,60,67,.16);
 --wall:radial-gradient(120% 70% at 15% 10%,#b8d4ff 0,rgba(184,212,255,0) 55%),radial-gradient(90% 60% at 90% 35%,#ffd0e6 0,rgba(255,208,230,0) 55%),radial-gradient(110% 70% at 40% 100%,#c6f0dc 0,rgba(198,240,220,0) 60%),#eef2f8;
 --g-bg:rgba(255,255,255,.40);--g-strong:rgba(255,255,255,.72);--g-brd:rgba(255,255,255,.65);--g-hi:rgba(255,255,255,.9);
 --g-shadow:0 10px 30px rgba(20,30,60,.16),0 1px 3px rgba(20,30,60,.08);
 --dim:rgba(240,243,250,.35);
}
@media (prefers-color-scheme:dark){:root{
 --fg:#f5f5f7;--sub:rgba(235,235,245,.62);--blue:#3b9bff;--line:rgba(255,255,255,.12);
 --wall:radial-gradient(120% 70% at 15% 10%,#1d3a78 0,rgba(29,58,120,0) 55%),radial-gradient(90% 60% at 90% 35%,#4a1f55 0,rgba(74,31,85,0) 55%),radial-gradient(110% 70% at 40% 100%,#0f4b3d 0,rgba(15,75,61,0) 60%),#07080d;
 --g-bg:rgba(36,36,44,.38);--g-strong:rgba(44,44,52,.78);--g-brd:rgba(255,255,255,.16);--g-hi:rgba(255,255,255,.28);
 --g-shadow:0 10px 30px rgba(0,0,0,.5),0 1px 3px rgba(0,0,0,.3);
 --dim:rgba(0,0,0,.35);color-scheme:dark}}
#phone.priv{
 --fg:#f5f5f7;--sub:rgba(235,235,245,.62);--blue:#3b9bff;--line:rgba(255,255,255,.12);
 --wall:radial-gradient(120% 70% at 20% 10%,#2c2a4a 0,rgba(44,42,74,0) 55%),radial-gradient(90% 60% at 85% 60%,#3a2440 0,rgba(58,36,64,0) 55%),#121216;
 --g-bg:rgba(30,30,36,.5);--g-strong:rgba(40,40,48,.85);--g-brd:rgba(255,255,255,.14);--g-hi:rgba(255,255,255,.22);
 --g-shadow:0 10px 30px rgba(0,0,0,.55);--dim:rgba(0,0,0,.4);color-scheme:dark}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:#000}
body{font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent;overflow:hidden;overscroll-behavior:none}
button,input{font:inherit;color:inherit;border:0;background:none}
button{cursor:pointer}
svg.i{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;flex:none}
svg.s{width:15px;height:15px}

#stage{height:100%;display:flex;justify-content:center;align-items:center;background:#111}
#phone{position:relative;width:100%;max-width:430px;height:100%;overflow:hidden;color:var(--fg);background:var(--wall);background-attachment:fixed}
@media (min-width:600px){#phone{height:min(900px,96vh);border-radius:54px;box-shadow:0 0 0 10px #1c1c1e,0 0 0 11px #3a3a3c,0 40px 90px rgba(0,0,0,.6)}}

/* ---------- Liquid Glass ---------- */
.glass{position:relative;isolation:isolate;background:var(--g-bg);-webkit-backdrop-filter:blur(16px) saturate(190%) brightness(1.04);backdrop-filter:blur(16px) saturate(190%) brightness(1.04);border:1px solid var(--g-brd);box-shadow:inset 0 1px 1px var(--g-hi),inset 0 -1px 1px rgba(255,255,255,.06),inset 0 0 18px rgba(255,255,255,.08),var(--g-shadow)}
.glass::before{content:"";position:absolute;inset:0;border-radius:inherit;z-index:-1;pointer-events:none;background:linear-gradient(140deg,rgba(255,255,255,.38) 0%,rgba(255,255,255,.06) 32%,rgba(255,255,255,0) 55%,rgba(255,255,255,.10) 100%)}
.glass::after{content:"";position:absolute;left:14%;right:14%;top:0;height:1px;border-radius:1px;z-index:-1;pointer-events:none;background:linear-gradient(90deg,rgba(255,255,255,0),rgba(255,255,255,.95),rgba(255,255,255,0));opacity:.7}
html.refract .glass{-webkit-backdrop-filter:url(#lg) blur(14px) saturate(190%);backdrop-filter:url(#lg) blur(14px) saturate(190%)}
.press{transition:transform .45s cubic-bezier(.3,1.6,.5,1),background .2s,box-shadow .2s}
.press:active{transform:scale(.9);background:var(--g-strong)}

/* ---------- Pages ---------- */
#pages{position:absolute;inset:0}
.frame{position:absolute;left:0;right:0;top:0;bottom:0;width:100%;height:100%;border:0;background:#fff;padding-top:env(safe-area-inset-top)}
.frame[hidden],#start[hidden],#blocked[hidden]{display:none}
#start,#blocked{position:absolute;inset:0;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:calc(env(safe-area-inset-top) + 56px) 20px 140px}
@media (min-width:600px){#start,#blocked{padding-top:72px}}
.hello{font-size:34px;font-weight:700;letter-spacing:-.02em;margin-bottom:22px}
.sec{font-size:20px;font-weight:700;letter-spacing:-.01em;margin:26px 2px 12px}
.favs{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:18px 10px}
.fav{display:flex;flex-direction:column;align-items:center;gap:7px;min-width:0}
.tile{width:64px;height:64px;border-radius:18px;display:grid;place-items:center;font-size:24px;font-weight:700;color:var(--fg);overflow:hidden}
.tile img{width:34px;height:34px;border-radius:8px}
.lt{display:inline-grid;place-items:center;font-weight:700;color:var(--fg)}
.tile .lt{font-size:26px}
b.lt.fi{width:20px;height:20px;font-size:13px}
.fl{font-size:12px;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.list{border-radius:22px;overflow:hidden}
.row{width:100%;display:flex;align-items:center;gap:12px;padding:13px 16px;text-align:left;min-width:0;border-top:1px solid var(--line)}
.row:first-child{border-top:0}
.row:active{background:rgba(127,127,127,.12)}
.row .tx{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:16px}
.row .tx small{display:block;font-size:12.5px;color:var(--sub);margin-top:1px;overflow:hidden;text-overflow:ellipsis}
.row svg,.row img.fi{color:var(--sub);flex:none}
.row img.fi{width:20px;height:20px;border-radius:5px}
.empty{color:var(--sub);font-size:15px;line-height:1.45;padding:4px 2px}
.privcard{margin-top:8px;padding:22px;border-radius:26px;text-align:center}
.privcard h3{font-size:21px;margin-bottom:6px}
.privcard p{color:var(--sub);font-size:15px;line-height:1.45}
.blk{display:flex;flex-direction:column;align-items:center;text-align:center;gap:12px;padding:30px 22px;border-radius:30px;margin-top:40px}
.blk .tile{width:80px;height:80px;border-radius:22px}
.blk b{font-size:20px;overflow-wrap:anywhere}
.blk p{color:var(--sub);font-size:14.5px;line-height:1.45}
.cta{display:inline-flex;align-items:center;gap:8px;height:48px;padding:0 22px;border-radius:24px;background:var(--blue);color:#fff;font-weight:600;font-size:16px;text-decoration:none}

/* ---------- Bottom bar ---------- */
#bar{position:absolute;left:12px;right:12px;bottom:calc(env(safe-area-inset-bottom) + 12px);display:flex;align-items:center;gap:8px;z-index:20;transition:transform .4s cubic-bezier(.3,1.4,.5,1)}
.gbtn{width:48px;height:48px;border-radius:50%;display:grid;place-items:center;flex:none;color:var(--fg);position:relative}
/* tab count badge — shows inside the button, hides the icon */
#tabsBtn svg{display:none}
#tabCount{display:flex;align-items:center;justify-content:center;width:26px;height:26px;border-radius:7px;border:2px solid var(--fg);font-size:13px;font-weight:700;color:var(--fg)}
.gbtn:disabled{opacity:.4}
#cap{flex:1;min-width:0;height:48px;border-radius:24px;display:flex;align-items:center;overflow:hidden}
#capLabel{flex:1;min-width:0;height:48px;display:flex;align-items:center;justify-content:center;gap:6px;padding:0 4px 0 16px;font-size:16px;font-weight:500}
#capLabel span{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#capLabel.ph{color:var(--sub);font-weight:400}
#reload{width:42px;height:48px;display:grid;place-items:center;flex:none;color:var(--fg)}
#urlInput{display:none;flex:1;min-width:0;height:48px;outline:none;font-size:17px;padding:0 6px 0 2px}
#urlInput::placeholder{color:var(--sub)}
#sic{display:none;padding-left:16px;color:var(--sub)}
#clr{display:none;width:40px;height:48px;place-items:center;color:var(--sub)}
#prog{position:absolute;left:0;bottom:0;height:2.5px;width:0;background:var(--blue);border-radius:2px;opacity:0;transition:width .5s ease,opacity .3s}
#phone.editing #capLabel,#phone.editing #reload,#phone.editing #back,#phone.editing #tabsBtn,#phone.editing #more{display:none}
#phone.editing #urlInput,#phone.editing #sic{display:block}
#phone.editing #clr{display:grid}
#cancel{display:none}
#phone.editing #cancel{display:grid}

#scrim{position:absolute;inset:0;z-index:15;background:var(--dim);-webkit-backdrop-filter:blur(18px) saturate(140%);backdrop-filter:blur(18px) saturate(140%);opacity:0;pointer-events:none;transition:opacity .25s}
#scrim.on{opacity:1;pointer-events:auto}
#sugg{position:absolute;left:12px;right:12px;bottom:calc(env(safe-area-inset-bottom) + 72px);top:calc(env(safe-area-inset-top) + 16px);z-index:16;display:none;flex-direction:column;justify-content:flex-end;overflow:hidden}
#phone.editing #sugg{display:flex}
#suggIn{overflow-y:auto;max-height:100%;padding-bottom:4px}
#suggIn .sec{margin-top:6px}

/* ---------- Menu ---------- */
#menu{position:absolute;right:12px;bottom:calc(env(safe-area-inset-bottom) + 72px);width:250px;border-radius:26px;z-index:25;padding:6px;transform-origin:bottom right;transform:scale(.6) translateY(20px);opacity:0;pointer-events:none;transition:transform .4s cubic-bezier(.3,1.5,.5,1),opacity .2s}
#menu.on{transform:none;opacity:1;pointer-events:auto}
#menu .mi{width:100%;display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 14px;border-radius:18px;font-size:16px;text-align:left}
#menu .mi:active{background:rgba(127,127,127,.18)}
#menu .mi:disabled{opacity:.35}
#menu hr{border:0;height:1px;background:var(--line);margin:4px 10px}
#menuCatch{position:absolute;inset:0;z-index:24;display:none}
#menuCatch.on{display:block}

/* ---------- Tab overview ---------- */
.layer{position:absolute;inset:0;z-index:30;display:flex;flex-direction:column;background:var(--wall)}
.layer[hidden]{display:none}
.lhead{text-align:center;font-weight:600;font-size:17px;padding:calc(env(safe-area-inset-top) + 18px) 16px 6px}
@media (min-width:600px){.lhead{padding-top:58px}}
#grid{flex:1;min-height:0;overflow-y:auto;padding:14px 16px 120px;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px;align-content:start}
.card{position:relative;height:236px;border-radius:26px;overflow:hidden;display:flex;flex-direction:column;text-align:left;padding:0;animation:pop .35s cubic-bezier(.3,1.4,.5,1) both}
.card.sel{box-shadow:0 0 0 3px var(--blue),var(--g-shadow)}
.card .shot{flex:1;min-height:0;margin:6px 6px 0;border-radius:20px;overflow:hidden;position:relative;background:rgba(255,255,255,.55)}
#phone.priv .card .shot,.dk .card .shot{background:rgba(0,0,0,.25)}
.shot .mini{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;padding:14px}
.shot .mini i{aspect-ratio:1;border-radius:9px;background:rgba(127,127,127,.22)}
.shot .gq{padding:14px;font-size:14px}
.shot .gq b{display:block;font-size:16px;line-height:1.25;overflow-wrap:anywhere;margin-bottom:8px}
.shot .gq i{display:block;height:7px;border-radius:4px;background:rgba(127,127,127,.25);margin-top:7px}
.shot .big{position:absolute;inset:0;display:grid;place-items:center}
.shot .big img{width:44px;height:44px;border-radius:11px}
.card .meta{display:flex;align-items:center;gap:7px;padding:8px 10px 10px 12px}
.card .meta img,.card .meta .ft{width:16px;height:16px;border-radius:4px;flex:none}
.card .meta .t{flex:1;min-width:0;font-size:13px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cx{position:absolute;top:12px;right:12px;width:28px;height:28px;border-radius:50%;display:grid;place-items:center;z-index:2;color:var(--fg)}
.cx svg{width:13px;height:13px;stroke-width:2.6}
#swBar{position:absolute;left:12px;right:12px;bottom:calc(env(safe-area-inset-bottom) + 12px);display:flex;align-items:center;justify-content:space-between;gap:8px;z-index:31}
.seg{display:flex;padding:4px;border-radius:24px;height:48px;align-items:center}
.seg button{height:40px;padding:0 16px;border-radius:20px;font-size:15px;font-weight:500;white-space:nowrap;transition:background .25s}
.seg button.on{background:var(--g-strong);box-shadow:inset 0 1px 1px var(--g-hi),0 2px 8px rgba(0,0,0,.12);font-weight:600}
.done{color:var(--blue)}

/* ---------- Bookmarks sheet ---------- */
#bmLayer{background:transparent}
#bmScrim{position:absolute;inset:0;background:var(--dim);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px)}
#bmSheet{position:absolute;left:8px;right:8px;bottom:8px;top:calc(env(safe-area-inset-top) + 40px);border-radius:34px;display:flex;flex-direction:column;overflow:hidden;animation:up .4s cubic-bezier(.3,1.2,.5,1)}
#bmSheet.glass{background:var(--g-strong)}
.bmh{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:14px 14px 8px}
.bmb{flex:1;min-height:0;overflow-y:auto;padding:6px 14px 24px}
.lnk{color:var(--blue);font-size:16px;padding:12px 4px}
.rm{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;color:var(--sub);flex:none;margin-right:10px}

#toast{position:absolute;left:50%;top:calc(env(safe-area-inset-top) + 14px);transform:translate(-50%,-20px);z-index:60;padding:11px 18px;border-radius:22px;font-size:14.5px;font-weight:500;opacity:0;pointer-events:none;transition:opacity .25s,transform .45s cubic-bezier(.3,1.5,.5,1);max-width:90%;text-align:center}
#toast.show{opacity:1;transform:translate(-50%,0)}
@media (min-width:600px){#toast{top:56px}}

#sb{display:none;position:absolute;top:0;left:0;right:0;height:50px;z-index:40;justify-content:space-between;align-items:center;padding:6px 38px 0;font-weight:600;font-size:16px;pointer-events:none;color:var(--fg)}
@media (min-width:600px){#sb{display:flex}}

@keyframes pop{from{transform:scale(.85);opacity:0}to{transform:none;opacity:1}}
@keyframes up{from{transform:translateY(60px);opacity:0}to{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
button:focus-visible,input:focus-visible,a:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
</style>
</head>
<body>

<svg width="0" height="0" style="position:absolute" aria-hidden="true">
 <defs>
  <filter id="lg" x="0" y="0" width="100%" height="100%" color-interpolation-filters="sRGB">
   <feTurbulence type="fractalNoise" baseFrequency="0.006 0.012" numOctaves="2" seed="7" result="n"/>
   <feGaussianBlur in="n" stdDeviation="2" result="nb"/>
   <feDisplacementMap in="SourceGraphic" in2="nb" scale="22" xChannelSelector="R" yChannelSelector="G"/>
  </filter>
 </defs>
 <symbol id="i-back" viewBox="0 0 24 24"><polyline points="15 5 8 12 15 19"/></symbol>
 <symbol id="i-fwd" viewBox="0 0 24 24"><polyline points="9 5 16 12 9 19"/></symbol>
 <symbol id="i-share" viewBox="0 0 24 24"><path d="M12 15V3M8 7l4-4 4 4M7 10H6a2 2 0 0 0-2 2v7a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-7a2 2 0 0 0-2-2h-1"/></symbol>
 <symbol id="i-book" viewBox="0 0 24 24"><path d="M12 6.5C10.5 5 8 4.5 4 4.5v14c4 0 6.5.5 8 2 1.5-1.5 4-2 8-2v-14c-4 0-6.5.5-8 2zM12 6.5v14"/></symbol>
 <symbol id="i-tabs" viewBox="0 0 24 24"><rect x="3" y="8" width="13" height="13" rx="3"/><path d="M8 5.5A2.5 2.5 0 0 1 10.5 3h8A2.5 2.5 0 0 1 21 5.5v8a2.5 2.5 0 0 1-2.5 2.5"/></symbol>
 <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
 <symbol id="i-lock" viewBox="0 0 24 24"><rect x="5" y="11" width="14" height="9" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></symbol>
 <symbol id="i-reload" viewBox="0 0 24 24"><path d="M20 12a8 8 0 1 1-2.6-5.9M20 4v5h-5"/></symbol>
 <symbol id="i-x" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></symbol>
 <symbol id="i-xc" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M9 9l6 6M15 9l-6 6"/></symbol>
 <symbol id="i-search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="6.5"/><path d="M16 16l4.5 4.5"/></symbol>
 <symbol id="i-clock" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5"/><path d="M12 7.5V12l3 2"/></symbol>
 <symbol id="i-globe" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5"/><path d="M3.5 12h17M12 3.5c2.5 2.6 3.5 5.4 3.5 8.5s-1 5.9-3.5 8.5c-2.5-2.6-3.5-5.4-3.5-8.5s1-5.9 3.5-8.5z"/></symbol>
 <symbol id="i-out" viewBox="0 0 24 24"><path d="M14 4h6v6M20 4l-9 9M18 14v5a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V7a1 1 0 0 1 1-1h5"/></symbol>
 <symbol id="i-more" viewBox="0 0 24 24"><circle cx="5.5" cy="12" r="1.3" fill="currentColor"/><circle cx="12" cy="12" r="1.3" fill="currentColor"/><circle cx="18.5" cy="12" r="1.3" fill="currentColor"/></symbol>
 <symbol id="i-star" viewBox="0 0 24 24"><path d="M12 3.5l2.6 5.3 5.9.9-4.3 4.1 1 5.8L12 16.8l-5.2 2.8 1-5.8L3.5 9.7l5.9-.9z"/></symbol>
 <symbol id="i-hand" viewBox="0 0 24 24"><path d="M7 11V6a1.5 1.5 0 0 1 3 0v4M10 10V4.5a1.5 1.5 0 0 1 3 0V10M13 10V5.5a1.5 1.5 0 0 1 3 0V11M16 11V8a1.5 1.5 0 0 1 3 0v6a7 7 0 0 1-7 7h-.5a6.5 6.5 0 0 1-5.4-2.9L4 15a1.5 1.5 0 0 1 2.4-1.8L7 14"/></symbol>
 <symbol id="i-check" viewBox="0 0 24 24"><polyline points="5 12.5 10 17.5 19 7"/></symbol>
</svg>

<div id="stage"><div id="phone">
 <div id="sb"><span id="clock">9:41</span><span>●●●</span></div>

 <div id="pages">
  <div id="start"></div>
  <div id="blocked" hidden></div>
 </div>

 <div id="scrim"></div>
 <div id="sugg"><div id="suggIn"></div></div>

 <div id="bar">
  <button class="gbtn glass press" id="back" aria-label="Back"><svg class="i"><use href="#i-back"/></svg></button>
  <div class="glass" id="cap">
   <span id="sic"><svg class="i s"><use href="#i-search"/></svg></span>
   <button id="capLabel" aria-label="Search or enter website"></button>
   <input id="urlInput" type="text" inputmode="search" autocapitalize="off" autocorrect="off" spellcheck="false" enterkeyhint="go" placeholder="Search or enter URL" aria-label="Address">
   <button id="clr" aria-label="Clear text"><svg class="i s"><use href="#i-xc"/></svg></button>
   <button id="reload" aria-label="Reload"><svg class="i s" style="width:18px;height:18px"><use href="#i-reload"/></svg></button>
   <div id="prog"></div>
  </div>
  <button class="gbtn glass press" id="tabsBtn" aria-label="Show all tabs"><svg class="i"><use href="#i-tabs"/></svg><span id="tabCount"></span></button>
  <button class="gbtn glass press" id="more" aria-label="More"><svg class="i"><use href="#i-more"/></svg></button>
  <button class="gbtn glass press" id="cancel" aria-label="Cancel"><svg class="i"><use href="#i-x"/></svg></button>
 </div>

 <div id="menuCatch"></div>
 <div class="glass" id="menu" role="menu">
  <button class="mi" data-m="fwd">Forward<svg class="i"><use href="#i-fwd"/></svg></button>
  <button class="mi" data-m="reload">Reload<svg class="i"><use href="#i-reload"/></svg></button>
  <button class="mi" data-m="share">Share<svg class="i"><use href="#i-share"/></svg></button>
  <button class="mi" data-m="open">Open in Browser<svg class="i"><use href="#i-out"/></svg></button>
  <hr>
  <button class="mi" data-m="mark">Add Bookmark<svg class="i"><use href="#i-star"/></svg></button>
  <button class="mi" data-m="bm">Bookmarks &amp; History<svg class="i"><use href="#i-book"/></svg></button>
  <hr>
  <button class="mi" data-m="new">New Tab<svg class="i"><use href="#i-plus"/></svg></button>
  <button class="mi" data-m="newp">New Private Tab<svg class="i"><use href="#i-hand"/></svg></button>
 </div>

 <section class="layer" id="switcher" hidden>
  <div class="lhead" id="shead"></div>
  <div id="grid"></div>
  <div id="swBar">
   <button class="gbtn glass press" id="newTab" aria-label="New tab"><svg class="i"><use href="#i-plus"/></svg></button>
   <div class="seg glass"><button id="segP">Private</button><button id="segN">Tabs</button></div>
   <button class="gbtn glass press done" id="swDone" aria-label="Done"><svg class="i"><use href="#i-check"/></svg></button>
  </div>
 </section>

 <section class="layer" id="bmLayer" hidden>
  <div id="bmScrim"></div>
  <div class="glass" id="bmSheet">
   <div class="bmh">
    <div class="seg glass"><button id="segB">Bookmarks</button><button id="segH">History</button></div>
    <button class="gbtn glass press done" id="bmDone" aria-label="Done"><svg class="i"><use href="#i-check"/></svg></button>
   </div>
   <div class="bmb" id="bmBody"></div>
  </div>
 </section>

 <div class="glass" id="toast" role="status"></div>
</div></div>

<script>
(function(){
var $=function(s){return document.querySelector(s)};
var ls={get:function(k,d){try{var v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}},set:function(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
var esc=function(s){return String(s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})};

/* SVG backdrop-filter refraction: Chrome/Edge/Android only. Other browsers use plain blur glass. */
var ua=navigator.userAgent;
if(window.chrome&&!/CriOS|FxiOS|EdgiOS|iPhone|iPad/.test(ua))document.documentElement.classList.add('refract');

var FAVS=[
 {n:'Google',u:'https://www.google.com/webhp?igu=1'},
 {n:'Wikipedia',u:'https://en.m.wikipedia.org/wiki/Main_Page'},
 {n:'Maps',u:'https://maps.google.com/maps?q=Gloucester&output=embed'},
 {n:'YouTube',u:'https://www.youtube.com'},
 {n:'BBC',u:'https://www.bbc.co.uk'},
 {n:'GitHub',u:'https://github.com'},
 {n:'Bing',u:'https://www.bing.com'},
 {n:'Weather',u:'https://www.bbc.co.uk/weather'}
];
/* Sites known to refuse being shown inside another page */
var BLOCK=['github.com','bbc.co.uk','bbc.com','facebook.com','instagram.com','x.com','twitter.com','linkedin.com','amazon.co.uk','amazon.com','reddit.com','netflix.com','apple.com','icloud.com','mail.google.com','accounts.google.com','drive.google.com','docs.google.com','outlook.com','live.com','microsoft.com','tiktok.com','ebay.co.uk','ebay.com','paypal.com','whatsapp.com','spotify.com','bing.com','chatgpt.com','claude.ai','strava.com'];

var uid=1;
var S={tabs:[],cur:null,mode:'n',sw:false,editing:false,bmTab:'b'};
var hist=ls.get('gt_hist',[]);
var marks=ls.get('gt_marks',[{u:'https://en.m.wikipedia.org/wiki/Main_Page',t:'Wikipedia'}]);
var frames={};

function hostOf(u){try{return new URL(u).hostname.replace(/^www\.|^m\.|^en\.m\./,'')}catch(e){return u}}
function fav(u,sz){return 'https://www.google.com/s2/favicons?sz='+(sz||64)+'&domain='+encodeURIComponent(hostOf(u))}
function gSearch(q){return 'https://www.google.com/search?igu=1&hl=en-GB&q='+encodeURIComponent(q)}
function gPublic(q){return 'https://www.google.com/search?q='+encodeURIComponent(q)}
function isBlocked(u){var h;try{h=new URL(u).hostname}catch(e){return false}return BLOCK.some(function(b){return h===b||h.slice(-(b.length+1))==='.'+b})}
function frameSrc(e){
 if(e.q)return gSearch(e.q);
 var u=e.u,m;
 m=u.match(/youtube\.com\/watch\?v=([\w-]{6,})/)||u.match(/youtu\.be\/([\w-]{6,})/);
 if(m)return 'https://www.youtube.com/embed/'+m[1];
 if(/^https?:\/\/(www\.)?google\.[a-z.]+\/?$/.test(u))return 'https://www.google.com/webhp?igu=1';
 return u;
}
function publicUrl(e){if(e.t==='start')return '';if(e.q)return gPublic(e.q);return e.u.replace('webhp?igu=1','').replace('&output=embed','')}
function titleOf(e){return e.t==='start'?'Start Page':e.q?e.q:hostOf(e.u)}
function isYTHome(u){return /^https?:\/\/(www\.|m\.)?youtube\.com\/?$/.test(u)}
function parse(v){
 v=v.trim();if(!v)return null;
 if(/^https?:\/\/\S+$/i.test(v))return {t:'page',u:v};
 if(/^[^\s\/]+\.[a-z]{2,}(:\d+)?(\/\S*)?$/i.test(v))return {t:'page',u:'https://'+v};
 return {t:'page',q:v};
}

function newTab(priv){var t={id:uid++,priv:!!priv,h:[{t:'start'}],i:0};S.tabs.push(t);S.cur=t.id;return t}
function cur(){for(var i=0;i<S.tabs.length;i++)if(S.tabs[i].id===S.cur)return S.tabs[i];return S.tabs[0]}
function ent(t){t=t||cur();return t.h[t.i]}

var saved=ls.get('gt_tabs',null);
if(saved&&saved.tabs&&saved.tabs.length){saved.tabs.forEach(function(x){var n=newTab(false);n.h=x.h;n.i=x.i});S.cur=S.tabs[Math.min(saved.cur||0,S.tabs.length-1)].id}
else newTab(false);

function save(){
 var np=S.tabs.filter(function(t){return !t.priv}),ci=np.indexOf(cur());
 ls.set('gt_tabs',{tabs:np.map(function(t){return {h:t.h,i:t.i}}),cur:ci<0?0:ci});
 ls.set('gt_hist',hist);ls.set('gt_marks',marks);
}
function toast(m){var t=$('#toast');t.textContent=m;t.classList.add('show');clearTimeout(toast.k);toast.k=setTimeout(function(){t.classList.remove('show')},2200)}
function recents(){var s={},o=[];hist.forEach(function(h){if(h.q&&!s[h.q]){s[h.q]=1;o.push(h.q)}});return o}
window.__fe=function(img){var b=document.createElement('b');b.className='lt '+img.className;b.textContent=img.getAttribute('data-l');img.replaceWith(b)};
function imgTag(u,cls){return '<img class="'+(cls||'')+'" src="'+esc(fav(u))+'" alt="" data-l="'+esc(hostOf(u).charAt(0).toUpperCase())+'" onerror="__fe(this)">'}

/* ---------- Page loading ---------- */
function prog(on){
 var p=$('#prog');
 if(on){p.style.transition='none';p.style.width='0';p.style.opacity='1';p.offsetWidth;p.style.transition='width 2.5s cubic-bezier(.1,.7,.3,1),opacity .3s';p.style.width='82%'}
 else{p.style.transition='width .25s ease,opacity .4s .25s';p.style.width='100%';p.style.opacity='0'}
}
function dropFrame(t){if(frames[t.id]){frames[t.id].remove();delete frames[t.id]}}
function makeFrame(t){
 dropFrame(t);
 var e=ent(t),f=document.createElement('iframe');
 f.className='frame';
 f.setAttribute('sandbox','allow-scripts allow-same-origin allow-forms allow-popups allow-popups-to-escape-sandbox allow-presentation');
 f.setAttribute('allow','fullscreen; autoplay; encrypted-media; picture-in-picture; geolocation');
 f.setAttribute('referrerpolicy','strict-origin-when-cross-origin');
 f.hidden=true;
 f.addEventListener('load',function(){if(t.id===S.cur)prog(false)});
 f.src=frameSrc(e);
 $('#pages').appendChild(f);
 frames[t.id]=f;
 if(t.id===S.cur)prog(true);
 return f;
}

function showPage(){
 var t=cur(),e=ent(t);
 Object.keys(frames).forEach(function(k){frames[k].hidden=true});
 $('#start').hidden=true;$('#blocked').hidden=true;
 if(e.t==='start'){renderStart();$('#start').hidden=false;prog(false);return}
 if(!e.q&&(isBlocked(e.u)||isYTHome(e.u))){renderBlocked(e);$('#blocked').hidden=false;prog(false);return}
 var f=frames[t.id];
 if(!f||f.dataset.k!==JSON.stringify(e)){f=makeFrame(t);f.dataset.k=JSON.stringify(e)}
 f.hidden=false;
}

function go(entry){
 var t=cur();
 t.h=t.h.slice(0,t.i+1);t.h.push(entry);t.i=t.h.length-1;
 if(!t.priv&&entry.t!=='start'){hist.unshift(Object.assign({at:Date.now()},entry));if(hist.length>100)hist.length=100}
 S.editing=false;S.sw=false;closeMenu();closeBm();
 dropFrame(t);
 render();
}

/* ---------- Views ---------- */
function favGrid(){
 return '<div class="favs">'+FAVS.map(function(f){
  return '<button class="fav press" data-act="u" data-u="'+esc(f.u)+'"><span class="tile glass">'+imgTag(f.u)+'</span><span class="fl">'+esc(f.n)+'</span></button>';
 }).join('')+'</div>';
}
function recentList(n){
 var r=recents().slice(0,n);
 return r.length?'<div class="list glass">'+r.map(function(q){return '<button class="row" data-act="q" data-v="'+esc(q)+'"><svg class="i s"><use href="#i-clock"/></svg><span class="tx">'+esc(q)+'</span></button>'}).join('')+'</div>':'';
}
function renderStart(){
 var t=cur(),h='';
 var hr=new Date().getHours();
 h+='<div class="hello">'+(t.priv?'Private':(hr<12?'Good morning':hr<18?'Good afternoon':'Good evening'))+'</div>';
 if(t.priv)h+='<div class="privcard glass"><h3>Private Browsing</h3><p>Pages you open in Private tabs are not added to history or saved when you close this page.</p></div>';
 h+='<div class="sec">Favourites</div>'+favGrid();
 if(!t.priv){var r=recentList(6);h+='<div class="sec">Recent searches</div>'+(r||'<div class="empty">Tap the address bar to search Google.</div>')}
 $('#start').innerHTML=h;
}
function renderBlocked(e){
 var hn=hostOf(e.u);
 $('#blocked').innerHTML='<div class="blk glass"><span class="tile glass">'+imgTag(e.u)+'</span><b>'+esc(hn)+'</b><p>'+esc(hn)+' does not allow itself to be shown inside another page, so it opens in a full browser tab.</p><a class="cta press" href="'+esc(publicUrl(e))+'" target="_blank" rel="noopener"><svg class="i"><use href="#i-out"/></svg>Open '+esc(hn)+'</a></div>';
}

function render(){
 var t=cur(),e=ent(t),ph=$('#phone');
 ph.classList.toggle('priv',S.sw?S.mode==='p':t.priv);
 ph.classList.toggle('editing',S.editing);
 $('#scrim').classList.toggle('on',S.editing);
 var lb=$('#capLabel');
 if(e.t==='start'){lb.className='ph';lb.innerHTML='<svg class="i s"><use href="#i-search"/></svg><span>Search or URL</span>'}
 else{lb.className='';lb.innerHTML='<svg class="i s"><use href="#i-lock"/></svg><span>'+esc(e.q?e.q:hostOf(e.u))+'</span>'}
 $('#back').disabled=t.i<=0;
 $('#reload').style.visibility=e.t==='start'?'hidden':'visible';
 var ntabs=S.tabs.filter(function(x){return !x.priv}).length;
 $('#tabCount').textContent=ntabs>99?'99+':ntabs;
 $('#switcher').hidden=!S.sw;
 if(S.sw)renderGrid();
 showPage();
 save();
}

/* ---------- Tab overview ---------- */
function renderGrid(){
 var p=S.mode==='p',list=S.tabs.filter(function(t){return t.priv===p});
 $('#segN').classList.toggle('on',!p);$('#segP').classList.toggle('on',p);
 $('#shead').textContent=p?(list.length?list.length+' Private Tab'+(list.length>1?'s':''):'Private Browsing'):list.length+' Tab'+(list.length>1?'s':'');
 $('#grid').innerHTML=list.length?list.map(function(t,ix){
  var e=ent(t),shot,metaIcon;
  if(e.t==='start'){shot='<div class="mini"><i></i><i></i><i></i><i></i><i></i><i></i></div>';metaIcon='<svg class="i s ft"><use href="#i-search"/></svg>'}
  else if(e.q){shot='<div class="gq"><b>'+esc(e.q)+'</b>google.com<i></i><i style="width:80%"></i><i style="width:60%"></i><i></i><i style="width:70%"></i></div>';metaIcon=imgTag('https://google.com')}
  else{shot='<div class="big">'+imgTag(e.u)+'</div>';metaIcon=imgTag(e.u)}
  return '<div class="card glass'+(t.id===S.cur?' sel':'')+'" style="animation-delay:'+(ix*30)+'ms" role="button" tabindex="0" data-id="'+t.id+'"><button class="cx glass press" data-close="'+t.id+'" aria-label="Close tab"><svg class="i"><use href="#i-x"/></svg></button><div class="shot">'+shot+'</div><div class="meta">'+metaIcon+'<span class="t">'+esc(titleOf(e))+'</span></div></div>';
 }).join(''):'<div class="empty" style="grid-column:1/-1;text-align:center;padding-top:60px">No Private tabs open. Tap + to start one.</div>';
}
function closeTab(id){
 var t=S.tabs.filter(function(x){return x.id===id})[0];if(!t)return;
 dropFrame(t);
 S.tabs=S.tabs.filter(function(x){return x.id!==id});
 if(!S.tabs.filter(function(x){return !x.priv}).length){var keep=S.cur;newTab(false);if(keep!==id)S.cur=keep}
 if(S.cur===id){var pool=S.tabs.filter(function(x){return x.priv===t.priv});S.cur=(pool[pool.length-1]||S.tabs[0]).id}
 render();
}
function openSwitcher(){S.mode=cur().priv?'p':'n';S.sw=true;S.editing=false;closeMenu();render()}

/* ---------- Address editing ---------- */
function enterEdit(){
 var e=ent();S.editing=true;closeMenu();render();
 var i=$('#urlInput');i.value=e.t==='start'?'':(e.q||publicUrl(e));
 i.focus();try{i.select()}catch(x){}
 suggest();
}
function exitEdit(){S.editing=false;$('#urlInput').blur();render()}
function suggest(){
 var q=$('#urlInput').value.trim(),ql=q.toLowerCase(),h='';
 if(!q){
  h='<div class="sec">Favourites</div>'+favGrid();
  if(!cur().priv){var r=recentList(5);if(r)h+='<div class="sec">Recent searches</div>'+r}
 }else{
  var rows=[],p=parse(q);
  rows.push('<button class="row" data-act="q" data-v="'+esc(q)+'"><svg class="i s"><use href="#i-search"/></svg><span class="tx">'+esc(q)+'<small>Google Search</small></span></button>');
  if(p&&p.u)rows.unshift('<button class="row" data-act="u" data-u="'+esc(p.u)+'">'+imgTag(p.u,'fi')+'<span class="tx">'+esc(hostOf(p.u))+'<small>'+esc(p.u)+'</small></span></button>');
  if(!cur().priv)recents().filter(function(x){return x!==q&&x.toLowerCase().indexOf(ql)>-1}).slice(0,4).forEach(function(x){rows.push('<button class="row" data-act="q" data-v="'+esc(x)+'"><svg class="i s"><use href="#i-clock"/></svg><span class="tx">'+esc(x)+'</span></button>')});
  marks.concat(FAVS.map(function(f){return {u:f.u,t:f.n}})).filter(function(m){return (m.t+' '+m.u).toLowerCase().indexOf(ql)>-1}).slice(0,3).forEach(function(m){rows.push('<button class="row" data-act="u" data-u="'+esc(m.u)+'">'+imgTag(m.u,'fi')+'<span class="tx">'+esc(m.t)+'<small>'+esc(hostOf(m.u))+'</small></span></button>')});
  h='<div class="list glass">'+rows.join('')+'</div>';
 }
 $('#suggIn').innerHTML=h;
}

/* ---------- Menu ---------- */
function openMenu(){
 var t=cur(),e=ent(t),m=$('#menu');
 m.querySelector('[data-m=fwd]').disabled=t.i>=t.h.length-1;
 ['reload','share','open','mark'].forEach(function(k){m.querySelector('[data-m='+k+']').disabled=e.t==='start'});
 m.classList.add('on');$('#menuCatch').classList.add('on');
}
function closeMenu(){$('#menu').classList.remove('on');$('#menuCatch').classList.remove('on')}
function menuAct(k){
 var t=cur(),e=ent(t),u=publicUrl(e);
 closeMenu();
 if(k==='fwd'&&t.i<t.h.length-1){t.i++;dropFrame(t);render()}
 else if(k==='reload'){dropFrame(t);render()}
 else if(k==='share'){
  if(navigator.share){navigator.share({title:titleOf(e),url:u}).catch(function(){})}
  else{try{navigator.clipboard.writeText(u).then(function(){toast('Link copied')},function(){toast(u)})}catch(x){toast(u)}}
 }
 else if(k==='open'){window.open(u,'_blank','noopener')}
 else if(k==='mark'){if(!marks.some(function(m){return m.u===u})){marks.unshift({u:u,t:titleOf(e)});save()}toast('Added to Bookmarks')}
 else if(k==='bm')openBm();
 else if(k==='new'){newTab(false);render();enterEdit()}
 else if(k==='newp'){newTab(true);render();enterEdit()}
}

/* ---------- Bookmarks & history ---------- */
function renderBm(){
 var b=S.bmTab==='b',h='';
 $('#segB').classList.toggle('on',b);$('#segH').classList.toggle('on',!b);
 if(b){
  h=marks.length?'<div class="list glass">'+marks.map(function(m,i){return '<div class="row" style="padding:0"><button class="row" style="border:0;flex:1;min-width:0" data-act="u" data-u="'+esc(m.u)+'">'+imgTag(m.u,'fi')+'<span class="tx">'+esc(m.t)+'<small>'+esc(hostOf(m.u))+'</small></span></button><button class="rm" data-rm="'+i+'" aria-label="Remove bookmark"><svg class="i s"><use href="#i-xc"/></svg></button></div>'}).join('')+'</div>':'<div class="empty">No bookmarks yet. Open a page, tap ⋯ and choose Add Bookmark.</div>';
 }else{
  h=hist.length?'<div class="list glass">'+hist.slice(0,60).map(function(x){
   return x.q?'<button class="row" data-act="q" data-v="'+esc(x.q)+'"><svg class="i s"><use href="#i-search"/></svg><span class="tx">'+esc(x.q)+'<small>Google Search</small></span></button>':'<button class="row" data-act="u" data-u="'+esc(x.u)+'">'+imgTag(x.u,'fi')+'<span class="tx">'+esc(hostOf(x.u))+'<small>'+esc(x.u)+'</small></span></button>';
  }).join('')+'</div><button class="lnk" data-act="clear">Clear History</button>':'<div class="empty">No history yet. Private tabs are never saved here.</div>';
 }
 $('#bmBody').innerHTML=h;
}
function openBm(){S.bmTab='b';$('#bmLayer').hidden=false;renderBm()}
function closeBm(){$('#bmLayer').hidden=true}

/* ---------- Events ---------- */
function act(ev){
 var el=ev.target.closest('[data-act]');
 if(el){
  var a=el.getAttribute('data-act');
  if(a==='u')go({t:'page',u:el.getAttribute('data-u')});
  else if(a==='q')go({t:'page',q:el.getAttribute('data-v')});
  else if(a==='clear'){hist=[];save();renderBm();toast('History cleared')}
  return;
 }
 var rm=ev.target.closest('[data-rm]');
 if(rm){marks.splice(+rm.getAttribute('data-rm'),1);save();renderBm()}
}
['#start','#suggIn','#bmBody'].forEach(function(s){$(s).addEventListener('click',act)});
$('#sugg').addEventListener('pointerdown',function(ev){if(ev.target.closest('button'))ev.preventDefault()});
$('#scrim').addEventListener('click',exitEdit);
$('#capLabel').addEventListener('click',enterEdit);
$('#cancel').addEventListener('click',exitEdit);
$('#clr').addEventListener('pointerdown',function(ev){ev.preventDefault();$('#urlInput').value='';suggest()});
$('#urlInput').addEventListener('input',suggest);
$('#urlInput').addEventListener('keydown',function(ev){
 if(ev.key==='Enter'){ev.preventDefault();var p=parse(this.value);if(p){this.blur();go(p)}}
 else if(ev.key==='Escape')exitEdit();
});
$('#back').addEventListener('click',function(){var t=cur();if(t.i>0){t.i--;dropFrame(t);render()}});
$('#reload').addEventListener('click',function(){dropFrame(cur());render()});
$('#more').addEventListener('click',function(){$('#menu').classList.contains('on')?closeMenu():openMenu()});
$('#menuCatch').addEventListener('click',closeMenu);
$('#menu').addEventListener('click',function(ev){var b=ev.target.closest('[data-m]');if(b&&!b.disabled)menuAct(b.getAttribute('data-m'))});
$('#tabsBtn').addEventListener('click',openSwitcher);
$('#swDone').addEventListener('click',function(){S.sw=false;render()});
$('#segN').addEventListener('click',function(){S.mode='n';$('#phone').classList.remove('priv');renderGrid()});
$('#segP').addEventListener('click',function(){S.mode='p';$('#phone').classList.add('priv');renderGrid()});
$('#newTab').addEventListener('click',function(){newTab(S.mode==='p');S.sw=false;render();enterEdit()});
$('#grid').addEventListener('click',function(ev){
 var cx=ev.target.closest('[data-close]');if(cx){ev.stopPropagation();closeTab(+cx.getAttribute('data-close'));return}
 var c=ev.target.closest('.card');if(c){S.cur=+c.getAttribute('data-id');S.sw=false;render()}
});
$('#grid').addEventListener('keydown',function(ev){if((ev.key==='Enter'||ev.key===' ')&&ev.target.classList.contains('card')){ev.preventDefault();S.cur=+ev.target.getAttribute('data-id');S.sw=false;render()}});
$('#bmDone').addEventListener('click',closeBm);
$('#bmScrim').addEventListener('click',closeBm);
$('#segB').addEventListener('click',function(){S.bmTab='b';renderBm()});
$('#segH').addEventListener('click',function(){S.bmTab='h';renderBm()});
document.addEventListener('keydown',function(ev){if(ev.key==='Escape'){if(!$('#bmLayer').hidden)closeBm();else if(S.sw){S.sw=false;render()}else closeMenu()}});

function tick(){var d=new Date();$('#clock').textContent=d.getHours()+':'+('0'+d.getMinutes()).slice(-2)}
tick();setInterval(tick,30000);
render();
})();
</script>
</body>
</html>

</body></html>
